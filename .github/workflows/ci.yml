name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t openflix .
      - name: Démarre l'image et vérifie l'application
        run: |
          docker run -d --name openflix -p 8787:8787 openflix
          for i in $(seq 1 30); do curl -fs http://localhost:8787/api/health && break || sleep 1; done
          curl -fs http://localhost:8787/api/health
          curl -fsI http://localhost:8787/ | grep -i content-security-policy
          curl -fsI http://localhost:8787/manifest.webmanifest
          curl -fsI http://localhost:8787/sw.js
          docker logs openflix
